name: Build Static PHP CLI – Windows (Strict Extensions – intl fixed)

on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated or "all")'
        required: true
        type: string
        default: all
      extensions:
        description: 'Exact comma-separated extensions (strictly used, intl is now fully supported)'
        required: true
        type: string
        default: amqp,apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,ds,exif,ffi,fileinfo,filter,ftp,gd,intl,iconv,igbinary,libxml,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pdo,pdo_mysql,pdo_sqlite,pdo_sqlsrv,phar,rar,redis,session,shmop,simdjson,simplexml,soap,sockets,sqlite3,sqlsrv,ssh2,sysvshm,tokenizer,xml,xmlreader,xmlwriter,yac,yaml,zip,zlib

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          v="${{ inputs.php_versions }}"
          [[ "$v" == "all" || -z "$v" ]] && v="8.1,8.2,8.3,8.4"
          echo "matrix=$(jq -nc --arg v "$(echo $v | tr -d ' ')" '{"php-version": ($v|split(",")) }')" >> $GITHUB_OUTPUT

  build:
    needs: setup
    name: PHP ${{ matrix.php-version }} – custom extensions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      # ──────────────────────────────────────────────────────────────
      - name: Normalize & validate extension list
        id: ext
        shell: powershell
        run: |
          $raw = @"
          ${{ inputs.extensions }}
          "@
          $list = $raw -replace '\s','' -replace ',{2,}',',' -replace '^,|,$',''
          if (!$list) { exit 1 }
          
          # Force ICU download for intl (critical!)
          if ($list -like "*intl*") { $list = "icu,$list" }

          $hash = ($list | Get-FileHash -Algorithm SHA256).Hash.Substring(0,12)
          "EXTENSIONS=$list" >> $env:GITHUB_OUTPUT
          "HASH=$hash"       >> $env:GITHUB_OUTPUT

      # ──────────────────────────────────────────────────────────────
      - name: Checkout static-php-cli
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: main

      - name: Setup host PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl, composer
          extensions: curl, mbstring
          ini-values: memory_limit=-1

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Sources cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: sources-${{ steps.ext.outputs.HASH }}-${{ matrix.php-version }}-win

      - name: Install dependencies
        run: composer update --no-dev --prefer-dist -q

      - name: Validate spc
        run: bin/spc --version

      - name: Doctor (pre)
        run: bin/spc doctor --auto-fix

      # ──────────────────────────────────────────────────────────────
      # THIS IS THE FIX – we explicitly force ICU + all extensions
      # ──────────────────────────────────────────────────────────────
      - name: Download sources (with ICU if intl is present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/spc download `
            --with-php=${{ matrix.php-version }} `
            --for-extensions="${{ steps.ext.outputs.EXTENSIONS }}" `
            --for-libs=icu `
            --retry=5 `
            --prefer-pre-built

      - name: Doctor (post-download)
        run: bin/spc doctor --auto-fix

      - name: Install UPX
        run: bin/spc install-pkg upx

      # ──────────────────────────────────────────────────────────────
      - name: Build (strictly your list – intl will be there)
        run: |
          bin/spc build --build-cli --build-micro `
            "${{ steps.ext.outputs.EXTENSIONS }}" `
            --debug --with-upx-pack

      # ──────────────────────────────────────────────────────────────
      - name: Package
        shell: powershell
        run: |
          $ver = bin/spc dev:php-ver
          mkdir dist -ea 0
          Compress-Archive buildroot/bin/php.exe   "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-cli-win.zip"
          Compress-Archive buildroot/bin/micro.sfx "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-micro-win.zip"
          "PHPVER=$ver" >> $env:GITHUB_ENV

      - name: README
        run: |
          cat > dist/README.txt <<EOF
          Static PHP ${{ env.PHPVER }} (Windows)
          Extensions: ${{ steps.ext.outputs.EXTENSIONS }}
          Hash: ${{ steps.ext.outputs.HASH }}
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ env.PHPVER }}-${{ steps.ext.outputs.HASH }}-windows
          path: dist/
