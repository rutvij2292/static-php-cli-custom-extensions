name: Build Static PHP CLI – Windows (intl + any extensions – FINAL FIXED)

on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated or "all")'
        required: true
        type: string
        default: all
      extensions:
        description: 'Exact comma-separated extensions – used 100% strictly'
        required: true
        type: string
        default: amqp,apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,ds,exif,ffi,fileinfo,filter,ftp,gd,intl,iconv,igbinary,libxml,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pdo,pdo_mysql,pdo_sqlite,pdo_sqlsrv,phar,rar,redis,session,shmop,simdjson,simplexml,soap,sockets,sqlite3,sqlsrv,ssh2,sysvshm,tokenizer,xml,xmlreader,xmlwriter,yac,yaml,zip,zlib

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          v="${{ inputs.php_versions }}"
          [[ "$v" == "all" || -z "$v" ]] && v="8.1,8.2,8.3,8.4"
          echo "matrix=$(jq -nc --arg v "${v// /}" '{"php-version": ($v|split(",")) }')" >> $GITHUB_OUTPUT

  build:
    needs: setup
    name: PHP ${{ matrix.php-version }} – custom extensions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      # ── 1. Prepare extension list + hash (PowerShell) ──
      - name: Prepare extensions & hash
        id: ext
        shell: powershell
        run: |
          $raw = "${{ inputs.extensions }}".Trim()
          $list = $raw -replace '\s+','' -replace ',{2,}',' ,' -replace '^,+|,+$',''

          if ([string]::IsNullOrWhiteSpace($list)) {
            Write-Error "Extension list cannot be empty"
            exit 1
          }

          # Force ICU library when intl is present
          if ($list -match '\bintl\b') {
            $list = "icu,$list"
            Write-Host "intl detected → ICU library will be downloaded"
          }

          # SHA256 hash of the exact list (no pipeline bug)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($list)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha.ComputeHash($bytes)
          $hash = ($hashBytes[0..11] | ForEach-Object { $_.ToString("x2") }) -join ''

          "EXTENSIONS=$list" >> $env:GITHUB_OUTPUT
          "HASH=$hash"       >> $env:GITHUB_OUTPUT
          Write-Host "Final list for spc: $list"
          Write-Host "Hash: $hash"

      # ── 2. Checkout static-php-cli ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: main

      # ── 3. Setup host PHP + composer ──
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer
          extensions: curl, mbstring
          ini-values: memory_limit=-1

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Sources cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ steps.ext.outputs.HASH }}-${{ matrix.php-version }}-win

      - name: Install dependencies
        run: composer update --no-dev --prefer-dist -q

      # ── 4. Doctor & validate ──
      - run: bin/spc --version
      - run: bin/spc doctor --auto-fix

      # ── 5. Download sources – using BASH (no ^ problems!) ──
      - name: Download sources (incl. ICU if intl present)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/spc download \
            --with-php=${{ matrix.php-version }} \
            --for-extensions="${{ steps.ext.outputs.EXTENSIONS }}" \
            --retry=5 \
            --prefer-pre-built \
            --ignore-cache-sources=php-src

      - run: bin/spc doctor --auto-fix

      # ── 6. Install UPX ──
      - run: bin/spc install-pkg upx

      # ── 7. Build – also using bash (clean & safe) ──
      - name: Build PHP + extensions
        shell: bash
        run: |
          bin/spc build --build-cli --build-micro \
            "${{ steps.ext.outputs.EXTENSIONS }}" \
            --debug --with-upx-pack

      # ── 8. Package ──
      - name: Package binaries
        shell: powershell
        run: |
          $ver = bin/spc dev:php-ver
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path buildroot/bin/php.exe   -DestinationPath "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-cli-win.zip"
          Compress-Archive -Path buildroot/bin/micro.sfx -DestinationPath "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-micro-win.zip"
          "PHPVER=$ver" >> $env:GITHUB_ENV

      # ── 9. README ──
      - name: Create README
        shell: bash
        run: |
          cat > dist/README.txt <<EOF
          Static PHP ${{ env.PHPVER }} (Windows x64)

          Extensions requested : ${{ inputs.extensions }}
          Full list sent to spc: ${{ steps.ext.outputs.EXTENSIONS }}
          Build hash           : ${{ steps.ext.outputs.HASH }}

          Contains:
          • php-${{ env.PHPVER }}-${{ steps.ext.outputs.HASH }}-cli-win.zip
          • php-${{ env.PHPVER }}-${{ steps.ext.outputs.HASH }}-micro-win.zip
          EOF

      # ── 10. Upload ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ env.PHPVER }}-${{ steps.ext.outputs.HASH }}-windows
          path: dist/
          if-no-files-found: error
