name: Build Static PHP CLI – Windows (intl works perfectly)

on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated or "all")'
        required: true
        default: all
      extensions:
        description: 'Exact extensions (comma-separated, no spaces)'
        required: true
        default: ctype,mbstring,openssl,curl,gd,intl,zip,redis,opcache,sqlite3,pdo_sqlite
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          v="${{ inputs.php_versions }}"
          [[ "$v" == "all" || -z "$v" ]] && v="8.1,8.2,8.3,8.4"
          echo "matrix=$(jq -nc --arg v "${v// /}" '{"php-version": ($v|split(","))}')" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      # ── 1. Prepare clean extension list + detect intl ──
      - name: Prepare extensions (intl → ICU lib)
        id: ext
        shell: powershell
        run: |
          $raw = "${{ inputs.extensions }}".Trim()
          $clean = $raw -replace '\s+','' -replace ',{2,}',' ,' -replace '^,+|,+$',''

          if ([string]::IsNullOrWhiteSpace($clean)) { Write-Error "Empty list"; exit 1 }

          $hasIntl = $clean -match '\bintl\b'
          $hashBytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($clean))
          $hash = ($hashBytes[0..11] | ForEach-Object { $_.ToString("x2") }) -join ''

          "EXTENSIONS=$clean"        >> $env:GITHUB_OUTPUT
          "HASH=$hash"               >> $env:GITHUB_OUTPUT
          "NEEDS_ICU=$hasIntl"       >> $env:GITHUB_OUTPUT

          Write-Host "Extensions: $clean"
          Write-Host "intl detected: $hasIntl"
          Write-Host "Hash: $hash"

      # ── 2. Checkout + setup ──
      - uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer
          extensions: curl,mbstring
          ini-values: memory_limit=-1

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/cache@v4
        with:
          path: downloads
          key: dl-${{ steps.ext.outputs.HASH }}-${{ matrix.php-version }}

      - run: composer update --no-dev --prefer-dist -q

      # ── 3. Doctor ──
      - run: bin/spc doctor --auto-fix

      # ── 4. Download sources – correct ICU handling ──
      - name: Download sources
        shell: bash
        run: |
          CMD="bin/spc download \
            --with-php=${{ matrix.php-version }} \
            --for-extensions=\"${{ steps.ext.outputs.EXTENSIONS }}\" \
            --retry=5 \
            --prefer-pre-built"

          ${{ steps.ext.outputs.NEEDS_ICU == 'true' && echo '--for-libs=icu \\' || echo '' }
          if [[ "${{ steps.ext.outputs.NEEDS_ICU }}" == "true" ]]; then
            CMD="$CMD --for-libs=icu"
          fi

          echo "Running: $CMD"
          eval $CMD

      - run: bin/spc doctor --auto-fix

      - run: bin/spc install-pkg upx

      # ── 5. Build – only real extensions ──
      - name: Build
        shell: bash
        run: |
          bin/spc build --build-cli --build-micro \
            "${{ steps.ext.outputs.EXTENSIONS }}" \
            --debug --with-upx-pack

      # ── 6. Package + upload ──
      - name: Package
        shell: powershell
        run: |
          $ver = bin/spc dev:php-ver
          mkdir dist -Force
          Compress-Archive buildroot/bin/php.exe   "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-cli-win.zip"
          Compress-Archive buildroot/bin/micro.sfx "dist/php-${ver}-${{ steps.ext.outputs.HASH }}-micro-win.zip"
          "PHPVER=$ver" >> $env:GITHUB_ENV

      - name: README
        run: |
          cat > dist/README.txt <<EOF
          Static PHP ${{ env.PHPVER }} (Windows)
          Extensions: ${{ inputs.extensions }}
          intl included: ${{ steps.ext.outputs.NEEDS_ICU == 'true' && 'YES' || 'NO' }}
          Hash: ${{ steps.ext.outputs.HASH }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ env.PHPVER }}-${{ steps.ext.outputs.HASH }}-win
          path: dist/
